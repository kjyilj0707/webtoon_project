<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹툰 데이터 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="home-link" href="./index.html">← Webtoon Project 홈</a>
  <header>
    <h1>웹툰 데이터 대시보드</h1>
    <p id="summary" class="summary">불러오는 중...</p>
  </header>

  <section class="controls">
    <input id="searchInput" type="text" placeholder="제목으로 검색...">
    <select id="sortSelect">
      <option value="viewCount">조회수 순</option>
      <option value="favoriteCount">즐겨찾기 순</option>
      <option value="starScore">별점 순</option>
      <option value="year">연도 순</option>
    </select>
  </section>

  <section class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr>
          <th>순위</th>
          <th>제목</th>
          <th>작가</th>
          <th>상태</th>
          <th>별점</th>
          <th>조회수</th>
          <th>즐겨찾기</th>
          <th>연도</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="8" class="loading">데이터를 불러오는 중입니다...</td></tr>
      </tbody>
    </table>
  </section>

  <div class="load-more-wrap">
    <button id="loadMoreBtn" hidden>더 보기 (100개씩)</button>
    <button id="loadAllBtn" hidden>전체 불러오기</button>
  </div>

  <footer>
    <p>정렬 기준을 바꾸면 처음부터 다시 조회합니다.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
